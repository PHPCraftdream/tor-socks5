[package]
name = "tor-socks5-onion"
# Not published: the release artifact is the single `tor-socks5` package;
# workspace crates are its internal modules (docs/project/sdk-package-design.md).
publish = false
version = "0.2.0"
edition.workspace = true
license.workspace = true
description = "v3 onion service addresses (rend-spec-v3), the vanity prefix-search core, (behind the `keys` feature) onion identity keystore management via the Arti native keystore, and (behind the Tor-dependent `host` feature) the hosted onion-service manager, without printing or process state."
repository.workspace = true
homepage.workspace = true
readme = "README.md"
authors.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Onion identity keystore and identity management via the Arti native keystore
# (tor-keymgr/tor-hscrypto only — no Tor client, no patch-kit): the keystore
# directory is always an explicit argument.
keys = [
    "dep:anyhow",
    "dep:fs-mistrust",
    "dep:persist-lock",
    "dep:proxy-config",
    "dep:safelog",
    "dep:tempfile",
    "dep:tor-hscrypto",
    "dep:tor-keymgr",
    "dep:tor-llcrypto",
    "dep:tor-persist",
    "dep:tracing",
]
# Test helpers for dependent crates' own tests (R10): never in default/full.
test-seams = []

# Tor-dependent onion-service hosting (SDK-5): the whole server-side
# launch/serve/status choreography moved out of the binary. Requires the
# vendored Arti stack (patch-kit); implies `keys`.
host = [
    "keys",
    "arti-wrapper/onion-service",
    "dep:arti-wrapper",
    "dep:tor-socks5-runtime",
    "dep:tokio",
    "dep:tokio-util",
    "dep:futures",
    "dep:tor-hsservice",
    "dep:tor-cell",
    "dep:tor-proto",
    "dep:safelog",
    "dep:tor-hscrypto",
    "dep:tracing",
    "dep:anyhow",
    "dep:persist-lock",
    "dep:proxy-config",
    "dep:tempfile",
]

[dependencies]
# Declared non-optional because derive-deftly's expansion requires it in the
# manifest of the crate that uses `#[derive(Deftly)]` (keys/specifier.rs).
derive-deftly = { workspace = true }
anyhow = { workspace = true, optional = true }
data-encoding.workspace = true
ed25519-dalek.workspace = true
fs-mistrust = { workspace = true, optional = true }
getrandom.workspace = true
safelog = { workspace = true, optional = true }
sha2.workspace = true
sha3.workspace = true
tempfile = { workspace = true, optional = true }
thiserror.workspace = true
tor-hscrypto = { workspace = true, optional = true }
tor-keymgr = { workspace = true, optional = true }
tor-llcrypto = { workspace = true, optional = true }
tor-persist = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
zeroize.workspace = true
persist-lock = { path = "../../../../packages/persist-lock", version = "0.2.0", optional = true }
proxy-config = { path = "../../../../packages/proxy-config", version = "0.2.0", package = "tor-socks5-config", optional = true }
# `host` feature: the Tor-dependent onion-service hosting (same arti 0.48
# stack as the binary and Cargo.lock; the forks come from the patch-kit).
arti-wrapper = { path = "../../../../packages/arti-wrapper", version = "0.2.0", optional = true }
tor-socks5-runtime = { path = "../runtime", version = "0.2.0", optional = true }
tokio = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
tor-hsservice = { version = "0.48", optional = true }
tor-cell = { version = "0.48", optional = true }
tor-proto = { version = "0.48", optional = true }

# `start_paused`/`advance` in the async tests (tokio's `full` does not
# include `test-util`).
[dev-dependencies]
# `rustls::crypto::ring::default_provider().install_default()` in the host
# tests (same workspace entry runtime's dev-dependencies use; the workspace
# rustls enables the `ring` provider).
rustls.workspace = true
tokio = { workspace = true, features = ["test-util"] }
