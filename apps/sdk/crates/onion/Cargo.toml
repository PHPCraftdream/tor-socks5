[package]
name = "tor-socks5-onion"
# Not published: the release artifact is the single `tor-socks5` package;
# workspace crates are its internal modules (docs/project/sdk-package-design.md).
publish = false
version = "0.2.0"
edition.workspace = true
license.workspace = true
description = "v3 onion service addresses (rend-spec-v3) and the vanity prefix-search core, without Tor."
repository.workspace = true
homepage.workspace = true
readme = "README.md"
authors.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
data-encoding.workspace = true
ed25519-dalek.workspace = true
getrandom.workspace = true
sha2.workspace = true
sha3.workspace = true
thiserror.workspace = true
zeroize.workspace = true
