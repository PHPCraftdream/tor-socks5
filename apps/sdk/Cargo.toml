[package]
name = "tor-socks5"
# Not published to crates.io: the vendored Arti forks cannot travel with a
# crates.io package, so consumers take this crate by git tag and pull the
# forks with the patch-kit (README.md).
publish = false
version = "0.2.0"
edition.workspace = true
license.workspace = true
description = "One dependency for the tor-socks5 libraries: a thin facade over the workspace crates, picked by feature."
repository.workspace = true
homepage.workspace = true
readme = "README.md"
authors.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[features]
# Tor-free by default: `tor` links Arti, which needs the patch-kit.
default = ["socks5", "auth", "config", "bridges"]
socks5 = ["dep:tor-socks5-proto"]
acl = ["dep:tor-socks5-client-acl"]
route = ["acl", "dep:tor-socks5-route-pool"]
auth = ["acl", "dep:tor-socks5-auth"]
# H18: `config` no longer implies `bridges` — config must not pull the
# SQLite-backed bridge-verify-core.
config = ["acl", "dep:tor-socks5-config"]
bridges = ["dep:bridge-probe", "dep:bridge-store", "dep:bridge-verify-core"]
tor = ["socks5", "acl", "dep:arti-wrapper"]
fetch = ["tor", "bridges", "dep:bridge-fetcher"]
dns = ["tor", "acl", "dep:tor-socks5-dns"]
# Embedded Tor runtime APIs, opened step by step
# (docs/plans/sdk-coverage-plan.md): SDK-7 — the bridge-health writer and
# the guard-event observation layer; SDK-9 — the Tor client (settings from
# config, the PT entry point, the TorHandle surface, watchdog status, conn
# health). Links Arti — patch-kit needed (see README).
runtime = ["tor", "config", "bridges", "dep:tor-socks5-runtime", "dep:tokio-util", "dep:bridge-line", "dep:time"]
# Busybox pluggable-transport dispatch for an embedding host.
pt = ["runtime", "tor-socks5-runtime/pt"]
# Embedded SOCKS5 server. Links Arti — patch-kit needed (see README).
server = ["runtime", "onion-service", "dep:tor-socks5-server", "tor-socks5-server/onion-service"]
# Tor-free onion address and vanity core (the CLI uses the same crate).
onion = ["dep:tor-socks5-onion"]
# Server-side onion services: the full hosting stack (`onion-host`, hence
# `runtime` and `tor`) plus arti's onion-service support on wrapper/server.
onion-service = ["onion-host", "arti-wrapper/onion-service", "tor-socks5-server?/onion-service"]
# Hosted onion services (SDK-5): the server-side launch/serve/status
# choreography in tor-socks5-onion's Tor-dependent `host` feature. H18:
# implies `runtime` — `OnionHostConfig` takes the runtime's `TorHandle` and
# the facade's `CancellationToken`. Links Arti — patch-kit needed (see README).
onion-host = ["runtime", "dep:tor-socks5-onion", "tor-socks5-onion/host"]
# Onion service identity keys via the Arti native keystore (tor-keymgr +
# tor-hscrypto only: no Tor client, no patch-kit). H18: implies `config` —
# the keystore entry types come from the config crate — but not `bridges`.
onion-keys = ["config", "dep:tor-socks5-onion", "tor-socks5-onion/keys"]
full = ["socks5", "auth", "config", "bridges", "route", "tor", "fetch", "dns", "onion", "onion-keys", "onion-service", "onion-host", "runtime", "server", "pt"]

[dependencies]
persist-lock = { path = "../../packages/persist-lock", version = "0.2.0" }
tor-socks5-proto = { path = "../../packages/socks5-proto", version = "0.2.0", optional = true }
tor-socks5-client-acl = { path = "../../packages/proxy-config/client-acl", version = "0.2.0", optional = true }
tor-socks5-route-pool = { path = "../../packages/proxy-config/route-pool", version = "0.2.0", optional = true }
tor-socks5-auth = { path = "../../packages/auth", version = "0.2.0", optional = true }
tor-socks5-config = { path = "../../packages/proxy-config", version = "0.2.0", optional = true }
bridge-probe = { path = "../../packages/bridge-probe", version = "0.2.0", optional = true }
bridge-store = { path = "../../packages/bridge-store", version = "0.2.0", optional = true }
bridge-verify-core = { path = "../../packages/bridge-verify-core", version = "0.2.0", optional = true }
arti-wrapper = { path = "../../packages/arti-wrapper", version = "0.2.0", optional = true }
bridge-fetcher = { path = "../../packages/bridge-fetcher", version = "0.2.0", optional = true }
tor-socks5-dns = { path = "../../packages/dns-server", version = "0.2.0", optional = true }
tor-socks5-onion = { path = "crates/onion", version = "0.2.0", optional = true }
tor-socks5-runtime = { path = "crates/runtime", version = "0.2.0", optional = true }
tor-socks5-server = { path = "crates/server", version = "0.2.0", optional = true, default-features = false }
tokio-util = { workspace = true, optional = true }
bridge-line = { workspace = true, optional = true }
time = { workspace = true, optional = true }

# The surface test wires `runtime::observation_layer` into a real
# subscriber — the same wiring the proxy binary does.
[dev-dependencies]
tokio.workspace = true
tracing-subscriber.workspace = true

[[example]]
name = "embedded_server"
required-features = ["server"]

[[example]]
name = "onion_address"
required-features = ["onion"]

[[example]]
name = "onion_keys"
required-features = ["onion-keys"]

[[example]]
name = "accounts_config"
required-features = ["auth", "config"]

[[example]]
name = "tor_runtime"
required-features = ["runtime"]

[[example]]
name = "onion_host"
required-features = ["runtime", "onion-host"]

[[example]]
name = "bridge_fetch"
required-features = ["runtime"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
