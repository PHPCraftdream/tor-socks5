[package]
name = "socks5-proxy"
# Not published: the release artifact is the single `tor-socks5` package;
# workspace crates are its internal modules (docs/project/sdk-package-design.md).
publish = false
version = "0.2.0"
edition.workspace = true
license.workspace = true
description = "Local SOCKS5 proxy with embedded Tor (arti) and self-managed obfs4/webtunnel bridges."
repository.workspace = true
homepage.workspace = true
readme.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[features]
default = ["onion-service"]
# The facade's `server` feature implies `onion-service`, so the server stays
# a direct dependency: under `--no-default-features` the binary links the
# server without the onion stack. The `?` in the facade's
# `tor-socks5-server?/onion-service` would not reach a direct dep, so the
# binary feature enables it explicitly (same semantics as before H21).
onion-service = [
    "tor-socks5/onion-service",
    "tor-socks5/onion-keys",
    "tor-socks5-server/onion-service",
]

[dependencies]
# Facade over the SDK crates. `pt` implies `runtime` (tor + config + bridges);
# `auth` covers the users CLI. `config`, `persist`, onion address/vanity/keys
# and `host` come through `runtime`/`auth` and the `onion-service` feature.
tor-socks5 = { path = "../../apps/sdk", version = "0.2.0", default-features = false, features = [
    "pt",
    "auth",
] }
tor-socks5-server = { path = "../../apps/sdk/crates/server", version = "0.2.0", default-features = false }

service-manager.workspace = true
clap.workspace = true
rpassword.workspace = true

rustls.workspace = true
tokio.workspace = true
tokio-util.workspace = true

anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true

[dev-dependencies]
criterion.workspace = true
bridge-line.workspace = true
bridge-fetcher = { path = "../../packages/bridge-fetcher", version = "0.2.0" }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tor-socks5-runtime = { path = "../../apps/sdk/crates/runtime", version = "0.2.0", features = ["test-seams"] }
# `fresh_identity` (R10: the test-seams feature is enabled only by a
# dev-dependency on tor-socks5-onion).
tor-socks5-onion = { path = "../../apps/sdk/crates/onion", version = "0.2.0", features = ["keys", "test-seams"] }

[[bench]]
name = "socks5_bench"
harness = false

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[target.'cfg(all(unix, not(target_os = "android")))'.dependencies]
angelize = { workspace = true }
