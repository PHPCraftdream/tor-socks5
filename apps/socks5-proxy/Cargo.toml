[package]
name = "socks5-proxy"
# Not published: the release artifact is the single `tor-socks5` package;
# workspace crates are its internal modules (docs/sdk-package-design.md).
publish = false
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Local SOCKS5 proxy with embedded Tor (arti) and self-managed obfs4/webtunnel bridges."
repository.workspace = true
homepage.workspace = true
readme.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[dependencies]
arti-wrapper = { path = "../../packages/arti-wrapper", version = "0.1.0" }
auth = { path = "../../packages/auth", version = "0.1.0", package = "tor-socks5-auth" }
bridge-line.workspace = true
bridge-fetcher = { path = "../../packages/bridge-fetcher", version = "0.1.0" }
bridge-probe = { path = "../../packages/bridge-probe", version = "0.1.0" }
bridge-store = { path = "../../packages/bridge-store", version = "0.1.0" }
bridge-verify-core = { path = "../../packages/bridge-verify-core", version = "0.1.0" }
dns-server = { path = "../../packages/dns-server", version = "0.1.0", package = "tor-socks5-dns" }
persist-lock = { path = "../../packages/persist-lock", version = "0.1.0" }
rusqlite = { workspace = true }
proxy-config = { path = "../../packages/proxy-config", version = "0.1.0", package = "tor-socks5-config" }
socks5-proto = { path = "../../packages/socks5-proto", version = "0.1.0", package = "tor-socks5-proto" }
tor-error.workspace = true
lyrebird.workspace = true

ktav.workspace = true
service-manager.workspace = true
serde.workspace = true
serde_json = "1"
tempfile = "3"
indexmap.workspace = true
time.workspace = true
clap.workspace = true
rpassword.workspace = true

rustls.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true

anyhow.workspace = true
thiserror.workspace = true
getrandom.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true

[dev-dependencies]
criterion.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[[bench]]
name = "socks5_bench"
harness = false

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[target.'cfg(all(unix, not(target_os = "android")))'.dependencies]
daemonize = { workspace = true }
