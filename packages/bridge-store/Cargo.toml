[package]
name = "bridge-store"
# Not published: the release artifact is the single `tor-socks5` package;
# workspace crates are its internal modules (docs/sdk-package-design.md).
publish = false
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Persistent per-bridge reachability/health tracking (TCP-probe and circuit-layer failure counters), shared by the CLI daemon and the Android JNI engine."
repository.workspace = true
homepage.workspace = true
readme = "README.md"
authors.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
bridge-line.workspace = true
bridge-probe = { path = "../bridge-probe", version = "0.1.0" }
persist-lock = { path = "../persist-lock", version = "0.1.0" }
anyhow.workspace = true
time.workspace = true

[dev-dependencies]
tempfile = "3"
