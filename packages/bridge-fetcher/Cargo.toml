[package]
name = "bridge-fetcher"
# Not published: the release artifact is the single `tor-socks5` package;
# workspace crates are its internal modules (docs/sdk-package-design.md).
publish = false
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Fetch Tor bridge lines over HTTPS-via-Tor from configurable collectors."
repository.workspace = true
homepage.workspace = true
readme.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
arti-wrapper = { path = "../arti-wrapper", version = "0.1.0" }
bridge-line.workspace = true
bridge-probe = { path = "../bridge-probe", version = "0.1.0" }

tokio.workspace = true
tokio-util.workspace = true
tokio-rustls.workspace = true
futures.workspace = true
rustls.workspace = true
webpki-roots.workspace = true
httparse.workspace = true
url.workspace = true

anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
base64.workspace = true
criterion.workspace = true
proptest.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "io-util", "time"] }

[[bench]]
name = "fetcher_bench"
harness = false
