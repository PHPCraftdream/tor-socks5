[package]
name = "bridge-verify-core"
# Not published: the release artifact is the single `tor-socks5` package;
# workspace crates are its internal modules (docs/sdk-package-design.md).
publish = false
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Shared bridge-verification support logic: cache-dir snapshotting and PT child-ownership markers."
repository.workspace = true
homepage.workspace = true
readme = "README.md"
authors.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
rusqlite = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3"
