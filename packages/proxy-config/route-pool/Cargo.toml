[package]
name = "tor-socks5-route-pool"
# Not published: the release artifact is the single `tor-socks5` package;
# workspace crates are its internal modules (docs/project/sdk-package-design.md).
publish = false
version = "0.2.0"
edition.workspace = true
license.workspace = true
description = "Proxy pool routing for the pre and post hops: registrable-domain stickiness, rotation order, failover attempts and background probes."
repository.workspace = true
homepage.workspace = true
readme = "README.md"
authors.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "route_pool"

[dependencies]
client-acl = { path = "../client-acl", version = "0.2.0", package = "tor-socks5-client-acl" }
resocks5-net = { workspace = true, features = ["rotator"] }
tokio = { workspace = true }
tokio-util.workspace = true
tracing.workspace = true
# The embedded Public Suffix List is pinned exactly: the crate is republished
# every few days with list updates, each of which must be reviewed on bump.
psl = "=2.1.248"
idna = "1.1"
