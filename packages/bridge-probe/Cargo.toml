[package]
name = "bridge-probe"
# Not published: the release artifact is the single `tor-socks5` package;
# workspace crates are its internal modules (docs/sdk-package-design.md).
publish = false
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Parallel reachability probing and latency sort for Tor bridge lines."
repository.workspace = true
homepage.workspace = true
readme = "README.md"
authors.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
bridge-line.workspace = true
persist-lock = { path = "../persist-lock", version = "0.1.0" }

tokio = { workspace = true, features = ["net", "time", "macros", "rt", "io-util"] }
# TS5-02: the DoH wave race owns an admission token that stops still-queued
# attempts from starting once their owner stopped waiting.
tokio-util.workspace = true
futures.workspace = true
hickory-resolver.workspace = true
tracing.workspace = true
url.workspace = true
# A webtunnel bridge is only distinguishable from the ordinary website fronting
# it by completing a TLS WebSocket upgrade against it, so the probe needs its
# own TLS and minimal-HTTP stack. See `webtunnel_upgrade_probe`.
rustls.workspace = true
tokio-rustls.workspace = true
webpki-roots.workspace = true
httparse.workspace = true

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "probe_bench"
harness = false
