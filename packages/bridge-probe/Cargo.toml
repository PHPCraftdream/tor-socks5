[package]
name = "bridge-probe"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Parallel reachability probing and latency sort for Tor bridge lines."
repository.workspace = true
homepage.workspace = true
readme.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[dependencies]
bridge-line.workspace = true

tokio = { workspace = true, features = ["net", "time", "macros", "rt", "io-util"] }
futures.workspace = true
hickory-resolver.workspace = true
tracing.workspace = true
url.workspace = true
# A webtunnel bridge is only distinguishable from the ordinary website fronting
# it by completing a TLS WebSocket upgrade against it, so the probe needs its
# own TLS and minimal-HTTP stack. See `webtunnel_upgrade_probe`.
rustls.workspace = true
tokio-rustls.workspace = true
webpki-roots.workspace = true
httparse.workspace = true

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "probe_bench"
harness = false
