[package]
name = "android-ffi"
# Not published: the release artifact is the single `tor-socks5` package;
# workspace crates are its internal modules (docs/sdk-package-design.md).
publish = false
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Android JNI FFI crate embedding the tor-socks5 engine as libtorsocks5.so"
repository.workspace = true
homepage.workspace = true
readme.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[lib]
name = "torsocks5"
crate-type = ["cdylib"]

[dependencies]
arti-wrapper = { path = "../arti-wrapper", version = "0.1.0" }
auth = { path = "../auth", version = "0.1.0", package = "tor-socks5-auth" }
proxy-config = { path = "../proxy-config", version = "0.1.0", package = "tor-socks5-config" }
socks5-proto = { path = "../socks5-proto", version = "0.1.0", package = "tor-socks5-proto" }
bridge-probe = { path = "../bridge-probe", version = "0.1.0" }
bridge-fetcher = { path = "../bridge-fetcher", version = "0.1.0" }
bridge-store = { path = "../bridge-store", version = "0.1.0" }
bridge-verify-core = { path = "../bridge-verify-core", version = "0.1.0" }
rusqlite = { workspace = true }
bridge-line.workspace = true
tokio = { workspace = true }
tokio-util = { workspace = true, features = ["compat"] }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rustls = { workspace = true }
time = { workspace = true }
jni = "0.21"

# Android-only: backs the logcat sink in `android_log.rs`, which declares
# `__android_log_write` (from `liblog.so`, always present on-device)
# using libc's C type aliases. Not linked into host builds.
[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
