[package]
# Published name differs from the in-tree package/directory: "auth" is
# already taken on crates.io by an unrelated, abandoned crate (2018,
# pulls in ancient protobuf/grpc that no longer compiles). The
# `package = "tor-socks5-auth"` line in every consumer's [dependencies]
# keeps `use auth::...` working unchanged — Cargo's dependency-renaming
# feature makes the table KEY the extern-crate name, not this field.
name = "tor-socks5-auth"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "SOCKS5 user accounts and Argon2id-based RFC 1929 authenticator."
repository.workspace = true
homepage.workspace = true
readme = "README.md"
authors.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

# The produced library target keeps the pre-rename identifier: benches,
# this crate's own tests, and every in-workspace `use auth::...` stay
# unchanged. Only the crates.io-facing [package] name above differs.
[lib]
name = "auth"

[dependencies]
argon2.workspace = true
sha2.workspace = true
hmac.workspace = true
subtle.workspace = true
dashmap.workspace = true
getrandom.workspace = true

persist-lock = { path = "../persist-lock", version = "0.1.0" }

ktav.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true

anyhow.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "io-util"] }
criterion.workspace = true

[[bench]]
name = "auth_bench"
harness = false
