[package]
name = "persist-lock"
# Not published: the release artifact is the single `tor-socks5` package;
# workspace crates are its internal modules (docs/sdk-package-design.md).
publish = false
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Cross-process file-lock plumbing shared by all persistence writers: whole-file transaction locks, owned temp-file save guards, reader-side stale-temp cleanup, parent-directory fsync."
repository.workspace = true
homepage.workspace = true
readme = "README.md"
authors.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
anyhow.workspace = true
