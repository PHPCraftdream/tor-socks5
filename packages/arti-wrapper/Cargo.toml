[package]
name = "arti-wrapper"
# Not published: the release artifact is the single `tor-socks5` package;
# workspace crates are its internal modules (docs/sdk-package-design.md).
publish = false
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Thin wrapper over arti-client for embedded Tor with pluggable transports."
repository.workspace = true
homepage.workspace = true
readme.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
arti-client.workspace = true
tor-rtcompat.workspace = true
tor-chanmgr.workspace = true
tor-guardmgr.workspace = true
tor-linkspec.workspace = true
tokio.workspace = true
futures.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true

bridge-line.workspace = true

[dev-dependencies]
tempfile = "3"
rustls.workspace = true
