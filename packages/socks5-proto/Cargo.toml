[package]
# Published name differs from the in-tree package/directory: "socks5-proto"
# is already taken on crates.io by an unrelated, active crate
# (EAimTY/socks5-server, 248k downloads). See packages/auth/Cargo.toml
# for the same rename pattern.
name = "tor-socks5-proto"
# Not published: the release artifact is the single `tor-socks5` package;
# workspace crates are its internal modules (docs/project/sdk-package-design.md).
publish = false
version = "0.2.0"
edition.workspace = true
license.workspace = true
description = "Shared host authentication adapter for resocks5-net inbound SOCKS5 and HTTP CONNECT framing."
repository.workspace = true
homepage.workspace = true
readme = "README.md"
authors.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# The produced library target keeps the pre-rename identifier so every
# in-workspace `use socks5_proto::...` stays unchanged. Only the
# crates.io-facing [package] name above differs.
[lib]
name = "socks5_proto"

[dependencies]
resocks5-net.workspace = true
tokio.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
