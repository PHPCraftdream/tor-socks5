[package]
# Published name differs from the in-tree package/directory: "socks5-proto"
# is already taken on crates.io by an unrelated, active crate
# (EAimTY/socks5-server, 248k downloads). See packages/auth/Cargo.toml
# for the same rename pattern.
name = "tor-socks5-proto"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Minimal SOCKS5 server-side protocol implementation (RFC 1928 CONNECT + RFC 1929 auth), shared by the CLI app and the Android FFI crate."
repository.workspace = true
homepage.workspace = true
readme = "README.md"
authors.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

# The produced library target keeps the pre-rename identifier so every
# in-workspace `use socks5_proto::...` stays unchanged. Only the
# crates.io-facing [package] name above differs.
[lib]
name = "socks5_proto"

[dependencies]
anyhow.workspace = true
tokio.workspace = true

[dev-dependencies]
futures.workspace = true
