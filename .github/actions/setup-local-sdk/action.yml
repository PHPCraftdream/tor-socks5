name: Set up local resocks5 SDK
description: Check out the resocks5 SDK release that carries the server API at the workspace's sibling dependency path.
runs:
  using: composite
  steps:
    - uses: actions/checkout@v7
      with:
        repository: PHPCraftdream/resocks5
        ref: e754abaa88ce4f9745b4729652789ffc57f8ba4c
        path: .ci-deps/resocks5
        persist-credentials: false
    - shell: bash
      run: |
        set -euo pipefail
        test "$(git -C "$GITHUB_WORKSPACE/.ci-deps/resocks5" rev-parse HEAD)" = e754abaa88ce4f9745b4729652789ffc57f8ba4c
        test ! -e ../resocks5
        mv "$GITHUB_WORKSPACE/.ci-deps/resocks5" ../resocks5
