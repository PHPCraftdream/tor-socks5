name: Set up local resocks5 SDK
description: Check out the unpublished server API at the workspace's sibling dependency path.
runs:
  using: composite
  steps:
    - uses: actions/checkout@v7
      with:
        repository: PHPCraftdream/resocks5
        ref: 6bbacb078810e6ae016be89de81e58b1a0f3793b
        path: .ci-deps/resocks5
        persist-credentials: false
    - shell: bash
      run: |
        set -euo pipefail
        test ! -e ../resocks5
        mv "$GITHUB_WORKSPACE/.ci-deps/resocks5" ../resocks5
