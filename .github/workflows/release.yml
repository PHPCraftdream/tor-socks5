# Release — build native socks5-proxy binaries on tag push and publish a GitHub Release.
# Complements ci.yml (fmt/clippy/test on branch push & PR); this one fires only on `v*` tags.
#
# Поток: validate -> build (7 targets) -> release (download-artifact, strict package validation).
# Промежуточно создаётся DRAFT release; /releases/latest никогда не увидит релиз
# без checksum'ов. github.ref_name попадает в shell только через env.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      # id обязателен: job.outputs ссылаются на steps.tag.outputs.*.
      - name: Validate tag format
        id: tag
        env:
          GH_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # stdout вида tag=... / prerelease=... идёт в $GITHUB_OUTPUT.
          bash .github/release/validate-tag.sh "$GH_REF_NAME" > "$GITHUB_OUTPUT"

  license-audit:
    name: Cargo license policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-local-sdk
      - uses: dtolnay/rust-toolchain@stable
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  build:
    name: Build (${{ matrix.target }})
    needs: [validate, license-audit]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
            musl: true
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            archive: tar.gz
            musl: true
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - runner: macos-15
            target: aarch64-apple-darwin
            archive: tar.gz
    env:
      GH_REF_NAME: ${{ needs.validate.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-local-sdk

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.musl == true
        run: sudo apt-get update && sudo apt-get install --yes musl-tools

      - name: Build
        run: cargo build --locked --release -p socks5-proxy --target ${{ matrix.target }}

      - name: Alpine smoke (musl)
        if: matrix.musl == true
        shell: bash
        run: |
          set -euo pipefail
          binary="$PWD/target/${{ matrix.target }}/release/socks5-proxy"
          docker run --rm --network none --read-only --tmpfs /tmp --mount "type=bind,src=$binary,dst=/tor-socks5,readonly" alpine:3.22 /tor-socks5 --version

      - name: Package (unix)
        if: matrix.archive != 'zip'
        shell: bash
        run: |
          set -euo pipefail
          src="target/${{ matrix.target }}/release/socks5-proxy"
          archive="tor-socks5-$GH_REF_NAME-${{ matrix.target }}.tar.gz"
          # Rename to product name inside the archive.
          tmp="$(mktemp -d)"
          cp "$src" "$tmp/tor-socks5"
          tar czf "$archive" -C "$tmp" tor-socks5
          shasum -a 256 "$archive" > "$archive.sha256"

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          GH_REF_NAME: ${{ needs.validate.outputs.tag }}
        run: |
          $src = "target/${{ matrix.target }}/release/socks5-proxy.exe"
          $archive = "tor-socks5-$env:GH_REF_NAME-${{ matrix.target }}.zip"
          $tmp = New-Item -ItemType Directory -Path ([System.IO.Path]::GetTempPath() + [System.Guid]::NewGuid().ToString())
          Copy-Item $src "$tmp/tor-socks5.exe"
          Compress-Archive -Path "$tmp/tor-socks5.exe" -DestinationPath $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          "$hash *$archive" | Out-File -NoNewline -Encoding ascii "$archive.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: tor-socks5-${{ matrix.target }}
          path: |
            tor-socks5-${{ needs.validate.outputs.tag }}-${{ matrix.target }}.tar.gz
            tor-socks5-${{ needs.validate.outputs.tag }}-${{ matrix.target }}.tar.gz.sha256
            tor-socks5-${{ needs.validate.outputs.tag }}-${{ matrix.target }}.zip
            tor-socks5-${{ needs.validate.outputs.tag }}-${{ matrix.target }}.zip.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.validate.outputs.tag }}
      PRERELEASE: ${{ needs.validate.outputs.prerelease }}
      REMOTE_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish (draft -> release)
        env:
          ARTIFACTS_DIR: ${{ github.workspace }}/artifacts
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/release/publish.sh
