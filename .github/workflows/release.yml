# Release: verify a retained promotion and audit licenses before publishing.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      # id обязателен: job.outputs ссылаются на steps.tag.outputs.*.
      - name: Validate tag format
        id: tag
        env:
          GH_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # stdout вида tag=... / prerelease=... идёт в $GITHUB_OUTPUT.
          bash .github/release/validate-tag.sh "$GH_REF_NAME" > "$GITHUB_OUTPUT"

  license-audit:
    name: Cargo license policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-local-sdk
      - uses: dtolnay/rust-toolchain@stable
      - name: Capture Cargo workspace metadata (not the release build graph)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/license-inventory
          for target in \
            x86_64-unknown-linux-gnu \
            x86_64-unknown-linux-musl \
            aarch64-unknown-linux-gnu \
            aarch64-unknown-linux-musl \
            x86_64-pc-windows-msvc \
            x86_64-apple-darwin \
            aarch64-apple-darwin; do
            cargo metadata --locked --format-version 1 --filter-platform "$target" \
              > "target/license-inventory/cargo-metadata-$target.json"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-license-inventory
          path: target/license-inventory/cargo-metadata-*.json
          if-no-files-found: error
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny --config .github/deny.toml check licenses

  origin:
    name: Authenticate promotion (read-only)
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.validate.outputs.tag }}
      POLICY_SHA: ${{ vars.LICENSE_POLICY_SHA }}
      BUILD_SHA: ${{ vars.LICENSE_BUILD_SHA }}
      PROMOTION_RUN_ID: ${{ vars.LICENSE_PROMOTION_RUN_ID }}
      PROMOTION_ATTEMPT: ${{ vars.LICENSE_PROMOTION_ATTEMPT }}
      PROMOTION_ARTIFACT_ID: ${{ vars.LICENSE_PROMOTION_ARTIFACT_ID }}
      REVIEW_COMMIT: ${{ vars.LICENSE_REVIEW_COMMIT }}
      PRODUCER_RUN_ID: ${{ vars.LICENSE_PRODUCER_RUN_ID }}
      PRODUCER_ATTEMPT: ${{ vars.LICENSE_PRODUCER_ATTEMPT }}
      PRODUCER_ARTIFACT_ID: ${{ vars.LICENSE_PRODUCER_ARTIFACT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ vars.LICENSE_POLICY_SHA }}
          persist-credentials: false
      - name: Verify policy checkout identity
        run: |
          set -euo pipefail
          [[ "$POLICY_SHA" =~ ^[0-9a-f]{40}$ ]]
          [ "$(git rev-parse HEAD)" = "$POLICY_SHA" ]
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind tag to build and fetch promotion
        run: |
          set -euo pipefail
          [[ "$BUILD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REVIEW_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)"
          [ "$tag_sha" = "$BUILD_SHA" ]
          python3 -I .github/release/license/provenance.py fetch-promotion --policy-sha "$POLICY_SHA" --run-id "$PROMOTION_RUN_ID" --attempt "$PROMOTION_ATTEMPT" --artifact-id "$PROMOTION_ARTIFACT_ID" --head-sha "$BUILD_SHA" --tag "$TAG" --review-commit "$REVIEW_COMMIT" --producer-run-id "$PRODUCER_RUN_ID" --producer-attempt "$PRODUCER_ATTEMPT" --producer-artifact-id "$PRODUCER_ARTIFACT_ID" --output target/promoted

  release:
    name: Publish GitHub Release
    needs: [validate, origin, license-audit]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      TAG: ${{ needs.validate.outputs.tag }}
      PRERELEASE: ${{ needs.validate.outputs.prerelease }}
      REMOTE_REPO: ${{ github.repository }}
      POLICY_SHA: ${{ vars.LICENSE_POLICY_SHA }}
      BUILD_SHA: ${{ vars.LICENSE_BUILD_SHA }}
      PROMOTION_RUN_ID: ${{ vars.LICENSE_PROMOTION_RUN_ID }}
      PROMOTION_ATTEMPT: ${{ vars.LICENSE_PROMOTION_ATTEMPT }}
      PROMOTION_ARTIFACT_ID: ${{ vars.LICENSE_PROMOTION_ARTIFACT_ID }}
      REVIEW_COMMIT: ${{ vars.LICENSE_REVIEW_COMMIT }}
      PRODUCER_RUN_ID: ${{ vars.LICENSE_PRODUCER_RUN_ID }}
      PRODUCER_ATTEMPT: ${{ vars.LICENSE_PRODUCER_ATTEMPT }}
      PRODUCER_ARTIFACT_ID: ${{ vars.LICENSE_PRODUCER_ARTIFACT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ vars.LICENSE_POLICY_SHA }}
          persist-credentials: false
      - name: Verify policy checkout identity
        run: |
          set -euo pipefail
          [[ "$POLICY_SHA" =~ ^[0-9a-f]{40}$ ]]
          [ "$(git rev-parse HEAD)" = "$POLICY_SHA" ]
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Re-fetch promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)"
          [ "$tag_sha" = "$BUILD_SHA" ]
          python3 -I .github/release/license/provenance.py fetch-promotion --policy-sha "$POLICY_SHA" --run-id "$PROMOTION_RUN_ID" --attempt "$PROMOTION_ATTEMPT" --artifact-id "$PROMOTION_ARTIFACT_ID" --head-sha "$BUILD_SHA" --tag "$TAG" --review-commit "$REVIEW_COMMIT" --producer-run-id "$PRODUCER_RUN_ID" --producer-attempt "$PRODUCER_ATTEMPT" --producer-artifact-id "$PRODUCER_ARTIFACT_ID" --output target/promoted
      - name: Publish (draft -> release)
        env:
          ARTIFACTS_DIR: ${{ github.workspace }}/target/promoted/artifacts
          ORIGIN_DIR: ${{ github.workspace }}/target/promoted
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/release/publish-bundle.sh
