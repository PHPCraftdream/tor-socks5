# CI — tiered test model.
#
# T0: cheap structural checks that always run (fmt, line-limit, dir-entries,
#     publish-guard, packageability, msrv, android).
# T1: affected packages only, on pull requests (computed by
#     scripts/testing/test-affected.sh --base <pr base sha>).
# T2: full workspace run, on push to main and on workflow_dispatch (always:
# a manual dispatch has no reliable base to diff against, and an empty T1
# plan would run no tests at all).
# T3: nightly full run — a separate scheduled workflow, deliberately not here.
#
# See docs/plans/test-tiers.md for the full tier specification.
#
# fmt/clippy/test still mirror the local pre-push hook at .githooks/pre-push;
# line-limit/dir-entries/publish-guard/packageability/msrv/android are
# CI-only.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel on main pushes or manual dispatch; cancel superseded PR
  # and non-main branch runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  plan:
    name: Plan (tier selection)
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.plan.outputs.full }}
      packages: ${{ steps.plan.outputs.packages }}
      empty: ${{ steps.plan.outputs.empty }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-local-sdk
      - uses: dtolnay/rust-toolchain@stable
      # Tier-selection selftest: pure sh + jq + cargo metadata, no cargo build.
      - name: Selftest test-affected.sh
        run: sh scripts/testing/selftest.sh
      - name: Compute tier
        id: plan
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          pr=false
          force_full=false
          reason=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pr=true
            if ! git cat-file -e "$PR_BASE_SHA^{commit}" 2>/dev/null; then
              if ! git fetch --no-tags origin "$PR_BASE_SHA"; then
                force_full=true
                reason="could not fetch PR base commit"
              fi
            fi
          elif [ "${{ github.event_name }}" = "push" ]; then
            # push events fire only on main (see `on:` above): full tier.
            force_full=true
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual dispatch: FULL by default (no reliable base to diff against).
            force_full=true
          fi
          if ! command -v jq >/dev/null 2>&1; then
            force_full=true
            reason="jq not found on runner"
          fi
          out=""
          script_rc=0
          if [ "$force_full" != "true" ]; then
            if [ "$pr" = "true" ]; then
              args="--base $PR_BASE_SHA"
            else
              args=""
            fi
            # `|| script_rc=$?` keeps the runner's implicit `bash -e` from aborting
            # the step: a failing script must fall through to FULL below.
            out=$(sh scripts/testing/test-affected.sh $args --mode args --kind test) || script_rc=$?
          fi
          if [ "$script_rc" != "0" ]; then
            echo "::warning::test-affected.sh failed (rc=$script_rc); forcing FULL"
            force_full=true
            reason="test-affected.sh failed (rc=$script_rc)"
          fi
          full=false
          packages=""
          empty=false
          if [ "$force_full" = "true" ]; then
            full=true
            packages=""
            empty=false
          elif [ "$out" = "--workspace" ]; then
            full=true
          elif [ -z "$out" ]; then
            empty=true
          else
            packages="$out"
          fi
          {
            echo "full=$full"
            echo "packages=$packages"
            echo "empty=$empty"
          } >> "$GITHUB_OUTPUT"
          if [ "$full" = "true" ]; then
            tier="T2 FULL"
          elif [ "$empty" = "true" ]; then
            tier="T0 nothing to test"
          else
            tier="T1 affected"
          fi
          if [ -n "$packages" ]; then
            pkgs_line="Packages: \`$packages\`"
          else
            pkgs_line="Packages: —"
          fi
          {
            echo "## CI plan"
            echo "Tier: $tier"
            echo "$pkgs_line"
            if [ -n "$reason" ]; then
              echo "Reason: $reason"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-local-sdk
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy-full:
    name: Clippy T2 (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-local-sdk
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
        shell: bash

  clippy-affected:
    name: Clippy T1 (ubuntu-latest)
    needs: plan
    if: needs.plan.outputs.full != 'true' && needs.plan.outputs.empty != 'true'
    runs-on: ubuntu-latest
    env:
      PKGS: ${{ needs.plan.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-local-sdk
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy $PKGS --all-targets --locked -- -D warnings
        shell: bash

  test-full:
    name: Test T2 (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.full == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-local-sdk
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - uses: Swatinem/rust-cache@v2
      # ACL-тесты биндят отдельный loopback source 127.0.0.2; на macOS он не
      # назначен lo0 автоматически — назначаем явно перед тестами.
      - name: Assign loopback alias 127.0.0.2 (macOS)
        if: runner.os == 'macOS'
        run: sudo ifconfig lo0 alias 127.0.0.2 up
        shell: bash
      - run: cargo nextest run --workspace --locked --profile ci
        shell: bash
      # DNS stress на Windows: повторить весь DNS suite 10 раз в PR CI
      # (nightly flake: actual_ipv6_socket_options ConnectionReset при framed read).
      - name: DNS stress (Windows PR, flaky-hunt)
        if: matrix.os == 'windows-latest' && github.event_name == 'pull_request'
        run: cargo nextest run -p tor-socks5-dns --locked --profile flaky-hunt --stress-count 10
        shell: bash
      - run: cargo test --doc --workspace --exclude saturating-time --locked
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-t2-${{ matrix.os }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always() && matrix.os == 'windows-latest' && github.event_name == 'pull_request'
        with:
          name: junit-dns-stress-t2-windows-latest
          path: target/nextest/flaky-hunt/junit.xml
          if-no-files-found: ignore

  test-affected:
    name: Test T1 (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.full != 'true' && needs.plan.outputs.empty != 'true'
    runs-on: ${{ matrix.os }}
    env:
      PKGS: ${{ needs.plan.outputs.packages }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-local-sdk
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - uses: Swatinem/rust-cache@v2
      # ACL-тесты биндят отдельный loopback source 127.0.0.2; на macOS он не
      # назначен lo0 автоматически — назначаем явно перед тестами.
      - name: Assign loopback alias 127.0.0.2 (macOS)
        if: runner.os == 'macOS'
        run: sudo ifconfig lo0 alias 127.0.0.2 up
        shell: bash
      - run: cargo nextest run $PKGS --locked --profile ci
        shell: bash
      # DNS stress на Windows: только если DNS package затронут изменениями
      - name: DNS stress (Windows PR, flaky-hunt)
        if: matrix.os == 'windows-latest' && github.event_name == 'pull_request' && contains(env.PKGS, 'tor-socks5-dns')
        run: cargo nextest run -p tor-socks5-dns --locked --profile flaky-hunt --stress-count 10
        shell: bash
      # Doctests need a library target: `cargo test --doc -p <bin-only>` fails.
      - name: Doctests (library packages only)
        shell: bash
        run: |
          libs=$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(any(.targets[].kind[]; . == "lib" or . == "rlib" or . == "proc-macro")) | .name' \
            | tr -d '\r')
          args=""
          set -- $PKGS
          while [ $# -gt 0 ]; do
            if [ "$1" = "-p" ] && [ $# -ge 2 ]; then
              if [ "$2" != saturating-time ] && printf '%s\n' $libs | grep -qx -- "$2"; then
                args="$args -p $2"
              fi
              shift 2
            else
              shift
            fi
          done
          if [ -n "$args" ]; then
            cargo test --doc $args --locked
          else
            echo "no library package selected; doctests skipped"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-t1-${{ matrix.os }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always() && matrix.os == 'windows-latest' && github.event_name == 'pull_request' && contains(env.PKGS, 'tor-socks5-dns')
        with:
          name: junit-dns-stress-t1-windows-latest
          path: target/nextest/flaky-hunt/junit.xml
          if-no-files-found: ignore

  line-limit:
    name: First-party line limit (1000)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check first-party Rust files stay under 1000 lines
        run: sh scripts/check-line-limit.sh

  dir-entries:
    name: First-party directory size (7 entries)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check first-party directories stay at 7 entries or fewer
        run: sh scripts/check-dir-entries.sh

  publish-guard:
    name: Publish guard (publish = false)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check every package manifest is marked publish = false
        run: sh scripts/check-publish-guard.sh

  packageability:
    name: Packageability (cargo package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The publishable set has a single source — scripts/publishable-crates.sh,
      # the same list scripts/check-publish-guard.sh enforces. It is empty
      # today (all 20 package manifests carry publish = false), so the job
      # logs an explicit no-op instead of failing or skipping silently; once
      # the consolidated tor-socks5 crate exists (docs/project/sdk-package-design.md,
      # §6), every listed crate is packaged with `cargo package -p <crate>
      # --no-verify` (docs/project/publishing.md).
      - name: Resolve the publishable crate list
        id: crates
        run: echo "crates=$(sh scripts/publishable-crates.sh | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
      # cargo package --no-verify packs the .crate tarball without compiling
      # anything, so there is no build cache worth restoring, and the
      # toolchain is only needed once the list is non-empty.
      - uses: dtolnay/rust-toolchain@stable
        if: steps.crates.outputs.crates != ''
      - uses: ./.github/actions/setup-local-sdk
        if: steps.crates.outputs.crates != ''
      - name: cargo package every publishable crate (or log the empty no-op)
        run: sh scripts/check-packageability.sh

  msrv:
    name: MSRV (1.92)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-local-sdk
      - uses: dtolnay/rust-toolchain@1.92
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-1.92
      - run: cargo check --locked --workspace --all-targets

  android:
    name: Android arm64 (aarch64-linux-android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-local-sdk
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      # r27c matches the locally verified build in docs/android/android-cross-compile.md.
      - id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true
      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-linux-android
      # cargo-ndk injects the per-target CARGO_TARGET_*_LINKER plus CC/AR/CXX
      # env vars; without it, cc-based build scripts (ring, libsqlite3-sys
      # bundled sqlite, zstd-sys) have no NDK toolchain to compile C against
      # (see docs/android/android-cross-compile.md, "Why no .cargo/config.toml").
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      # Scoped to the packages that actually ship on Android (matches the
      # locally verified build), not --workspace: a workspace-wide check
      # pulls in arti-client's own dev-dependency on itself, which resolves
      # tor-rtcompat's native-tls/openssl-sys and has no NDK sysroot to
      # cross-compile against.
      - name: cargo ndk check (socks5-proxy + android-ffi, arm64-v8a)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: cargo ndk -t arm64-v8a check --locked -p socks5-proxy -p android-ffi
      - name: cargo ndk build (android-ffi cdylib, arm64-v8a)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: cargo ndk -t arm64-v8a build --locked -p android-ffi

  # === Offline-тесты установщиков и release-хелперов =====================
  # Независимые от Rust-тир job'ы: изменения .github/install и .github/release
  # обязаны проверяться сами (реальные скрипты как дочерние процессы, сеть
  # подменяется только в harness). Никаких Cargo/package зависимостей.
  installer-sh:
    name: Installer sh offline tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Syntax check (sh -n installer, bash -n release helpers)
        run: |
          set -eu
          sh -n .github/install/install.sh
          bash -n .github/release/validate-tag.sh
          bash -n .github/release/publish.sh
        shell: bash
      - name: install.sh offline suite (real POSIX sh as child process)
        run: python3 -I .github/install/tests/test_install.py ShInstallTests
        shell: bash
      # Live-update: реальная компиляция фикстур (cc/clang) + живой процесс
      # под заменой бинарника (см. running/test_live_update.py)
      - name: install.sh live-update suite (compiled fixtures)
        run: python3 -I .github/install/tests/running/test_live_update.py ShLiveUpdateTests
        shell: bash

  installer-windows:
    name: Installer PowerShell offline tests (5.1 + 7)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # Обе версии движка ОБЯЗАТЕЛЬНО: парсер-проверка встроенным
      # System.Management.Automation.Language.Parser + UTF-8 BOM check
      # (5.1 без BOM читает файл как ANSI), без сетевых установок
      # (PSScriptAnalyzer не используется).
      - name: Parser + UTF-8 BOM check (PowerShell 5.1)
        shell: powershell
        run: |
          $errors = $null
          foreach ($f in @('.github\install\install.ps1',
                           '.github\install\tests\powershell_mock.ps1',
                           '.github\install\tests\running\compile_windows.ps1',
                           '.github\install\tests\running\hold_mutex.ps1')) {
            $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $f))
            if ($bytes.Length -lt 3 -or $bytes[0] -ne 0xEF -or
                $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) {
              Write-Host "Нет UTF-8 BOM: $f"; exit 1
            }
            $parse = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $f), [ref]$parse, [ref]$errors) | Out-Null
            if ($errors -and $errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Host $_.Message }
              exit 1
            }
          }
      - name: Parser + UTF-8 BOM check (PowerShell 7)
        shell: pwsh
        run: |
          $errors = $null
          foreach ($f in @('.github\install\install.ps1',
                           '.github\install\tests\powershell_mock.ps1',
                           '.github\install\tests\running\compile_windows.ps1',
                           '.github\install\tests\running\hold_mutex.ps1')) {
            $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $f))
            if ($bytes.Length -lt 3 -or $bytes[0] -ne 0xEF -or
                $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) {
              Write-Host "Нет UTF-8 BOM: $f"; exit 1
            }
            $parse = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $f), [ref]$parse, [ref]$errors) | Out-Null
            if ($errors -and $errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Host $_.Message }
              exit 1
            }
          }
      # Сьют сам прогоняет установщик под ОБОИМИ движками (powershell + pwsh)
      - name: install.ps1 offline suite (both engines)
        run: python -I .github/install/tests/test_install.py PowerShellInstallTests
        shell: pwsh
      # Live-update: compile_windows.ps1 (5.1, отдельный хост на компиляцию)
      # собирает .NET Framework PE; сьют проверяет 2 движка сам
      - name: install.ps1 live-update suite (both engines, compiled fixtures)
        run: python -I .github/install/tests/running/test_live_update.py WindowsLiveUpdateTests
        shell: pwsh

  portability-diagnostics:
    name: Portability (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            musl: true
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            musl: true
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            musl: false
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-local-sdk
      - name: Установка системных инструментов musl
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: portability-${{ matrix.target }}
      - name: Build diagnostic binary
        run: cargo build --locked --release -p socks5-proxy --target ${{ matrix.target }}
      - name: Проверка ELF и запуск версии
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          MUSL: ${{ matrix.musl }}
        run: |
          set -euo pipefail
          binary="target/$TARGET/release/socks5-proxy"
          file "$binary"
          readelf -l "$binary" > /tmp/program-headers.txt
          readelf -d "$binary" > /tmp/dynamic-section.txt
          if [ "$MUSL" = "true" ]; then
            ! grep -q 'INTERP' /tmp/program-headers.txt
            ! grep -q '(NEEDED)' /tmp/dynamic-section.txt
            file "$binary" | grep -Eq 'statically linked|static-pie linked'
          fi
          "$binary" --version
          if [ "$MUSL" = "true" ]; then
            case "$TARGET" in
              x86_64-*) platform=linux/amd64 ;;
              aarch64-*) platform=linux/arm64 ;;
              *) echo "unsupported musl target: $TARGET" >&2; exit 1 ;;
            esac
            docker run --rm --network none --read-only \\
              --platform "$platform" \\
              --mount "type=bind,src=$(realpath "$binary"),dst=/socks5-proxy,readonly" \\
              alpine:3.22 /socks5-proxy --version
          fi

  release-scripts:
    name: Release helpers offline suite (validate-tag, publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: validate-tag.sh + publish.sh offline suite (gh stub, real jq/sha256sum/stat)
        run: python3 -I .github/install/tests/test_release.py
        shell: bash
