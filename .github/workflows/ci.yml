# CI — fmt, clippy, test across Linux / macOS / Windows; first-party line
# limit, publish guard, crate packageability, MSRV 1.89 and Android arm64
# cross-compile checks. fmt/clippy/test mirror the local pre-push hook at
# .githooks/pre-push; line-limit/publish-guard/packageability/msrv/android
# are CI-only.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --workspace

  line-limit:
    name: First-party line limit (1000)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check first-party Rust files stay under 1000 lines
        run: sh scripts/check-line-limit.sh

  publish-guard:
    name: Publish guard (publish = false)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check every package manifest is marked publish = false
        run: sh scripts/check-publish-guard.sh

  packageability:
    name: Packageability (cargo package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The publishable set has a single source — scripts/publishable-crates.sh,
      # the same list scripts/check-publish-guard.sh enforces. It is empty
      # today (all 20 package manifests carry publish = false), so the job
      # logs an explicit no-op instead of failing or skipping silently; once
      # the consolidated tor-socks5 crate exists (docs/sdk-package-design.md,
      # §6), every listed crate is packaged with `cargo package -p <crate>
      # --no-verify` (docs/publishing.md).
      - name: Resolve the publishable crate list
        id: crates
        run: echo "crates=$(sh scripts/publishable-crates.sh | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
      # cargo package --no-verify packs the .crate tarball without compiling
      # anything, so there is no build cache worth restoring, and the
      # toolchain is only needed once the list is non-empty.
      - uses: dtolnay/rust-toolchain@stable
        if: steps.crates.outputs.crates != ''
      - name: cargo package every publishable crate (or log the empty no-op)
        run: sh scripts/check-packageability.sh

  msrv:
    name: MSRV (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-1.89
      - run: cargo check --locked --workspace --all-targets

  android:
    name: Android arm64 (aarch64-linux-android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      # r27c matches the locally verified build in docs/android-cross-compile.md.
      - id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true
      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-linux-android
      # cargo-ndk injects the per-target CARGO_TARGET_*_LINKER plus CC/AR/CXX
      # env vars; without it, cc-based build scripts (ring, libsqlite3-sys
      # bundled sqlite, zstd-sys) have no NDK toolchain to compile C against
      # (see docs/android-cross-compile.md, "Why no .cargo/config.toml").
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      # Scoped to the packages that actually ship on Android (matches the
      # locally verified build), not --workspace: a workspace-wide check
      # pulls in arti-client's own dev-dependency on itself, which resolves
      # tor-rtcompat's native-tls/openssl-sys and has no NDK sysroot to
      # cross-compile against.
      - name: cargo ndk check (socks5-proxy + android-ffi, arm64-v8a)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: cargo ndk -t arm64-v8a check --locked -p socks5-proxy -p android-ffi
      - name: cargo ndk build (android-ffi cdylib, arm64-v8a)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: cargo ndk -t arm64-v8a build --locked -p android-ffi
