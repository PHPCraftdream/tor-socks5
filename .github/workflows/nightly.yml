# Ночной контур: ограниченные стресс-наборы, vendor и отдельные фичи.
# Полная матрица workspace здесь не запускается.
#
# Cron minute 17 is intentionally odd so it never collides with the
# top-of-hour stampede of other repositories' scheduled workflows.

name: Nightly tests

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      preset:
        description: "Standard Nightly or one partial Windows DNS diagnostic attempt"
        required: false
        default: standard
        type: choice
        options:
          - standard
          - windows-dns-rst

concurrency:
  group: nightly-tests
  # Nightly results are precious (they feed the report job and the issue
  # trail); never cancel a running nightly.
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  # Flaky hunt: repeat whole runs of the socket/clock-heavy suites with the
  # flaky-hunt nextest profile (status-level: all, retries stay 0 — repeats,
  # not masking). --stress-count verified against nextest 0.9.137
  # (`cargo nextest run --help`, "Stress testing options").
  flaky-hunt:
    name: Flaky hunt (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'workflow_dispatch' && inputs.preset == 'windows-dns-rst' && fromJSON('["windows-latest"]') || fromJSON('["ubuntu-latest","windows-latest","macos-latest"]') }}
    steps:
      - name: Validate Nightly preset
        env:
          NIGHTLY_EVENT: ${{ github.event_name }}
          NIGHTLY_PRESET: ${{ inputs.preset }}
        run: |
          case "$NIGHTLY_EVENT:$NIGHTLY_PRESET" in
            schedule:*|workflow_dispatch:|workflow_dispatch:standard)
              ;;
            workflow_dispatch:windows-dns-rst)
              ;;
            *)
              echo "Unsupported Nightly event or preset" >&2
              exit 1
              ;;
          esac
        shell: bash
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-local-sdk
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - uses: Swatinem/rust-cache@v2
      # Сохраняем исправление ACL fixtures при переносе nightly на сегменты.
      - name: Assign loopback alias 127.0.0.2 (macOS)
        if: runner.os == 'macOS'
        run: sudo ifconfig lo0 alias 127.0.0.2 up
        shell: bash
      - name: Run standard flaky hunt
        if: github.event_name != 'workflow_dispatch' || inputs.preset != 'windows-dns-rst'
        run: >-
          cargo nextest run --profile flaky-hunt --stress-count 10
          -p tor-socks5-dns -p tor-circmgr -p tor-guardmgr -p socks5-proxy
          --locked
        shell: bash
      - name: Run partial Windows DNS RST diagnostic
        if: github.event_name == 'workflow_dispatch' && inputs.preset == 'windows-dns-rst'
        run: |
          set -o pipefail
          cargo nextest run --profile flaky-hunt --stress-count 10 \
            --retries 0 -p tor-socks5-dns --locked 2>&1 |
            tee windows-dns-rst.log
        shell: bash
      # .config/nextest.toml defines [profile.flaky-hunt.junit] with
      # target/nextest/flaky-hunt/junit.xml, so the upload publishes the
      # report like the ci profile does.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-flaky-hunt-${{ matrix.os }}
          path: target/nextest/flaky-hunt/junit.xml
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch' && inputs.preset == 'windows-dns-rst'
        with:
          name: diagnostic-windows-dns-rst-raw
          path: windows-dns-rst.log
          if-no-files-found: ignore

  # Vendored crates that are NOT workspace members (coverage gap in
  # `cargo test --workspace`). The lockfile will change when the extra
  # members are added, so no --locked here.
  vendor-extra:
    name: Vendored extras (ubuntu)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.preset == '' || inputs.preset == 'standard'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-local-sdk
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Root Cargo.toml members array ends with the "vendor/tor-guardmgr"
      # line; append the three non-member vendor crates right after it.
      - name: Add non-member vendor crates to workspace members
        run: |
          sed -i 's|^\(\s*"vendor/tor-guardmgr",\)$|\1\n    "vendor/tor-chanmgr",\n    "vendor/tor-dirmgr",\n    "vendor/tor-dirclient",|' Cargo.toml
          grep -A7 '^members' Cargo.toml
        shell: bash
      # `static` is a feature of tor-dirmgr only (vendor/tor-dirmgr/Cargo.toml);
      # per-package feature syntax avoids failing on crates without the feature.
      - run: cargo test -p tor-chanmgr -p tor-dirclient -p tor-dirmgr --features tor-dirmgr/static
        shell: bash
      # hspath tests are gated on cfg(all(feature = "vanguards",
      # feature = "hs-common")) in vendor/tor-circmgr (verified present in
      # this tree: src/lib.rs:136, src/path/hspath.rs:35), so --all-features
      # compiles and runs them.
      - run: cargo test -p tor-circmgr --all-features
        shell: bash

  # Each-feature check of the config package and the arti wrapper.
  # Package names verified via `cargo metadata --offline --no-deps`:
  # tor-socks5-config (packages/proxy-config), arti-wrapper (packages/arti-wrapper).
  features:
    name: Feature matrix (ubuntu)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.preset == '' || inputs.preset == 'standard'))
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-local-sdk
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      - uses: Swatinem/rust-cache@v2
      - run: cargo hack check --each-feature --no-dev-deps -p tor-socks5-config -p arti-wrapper
        shell: bash

  # Consolidated report: step summary + at most one open "Nightly tests
  # failed" issue (comment on existing instead of creating duplicates;
  # auto-close with a "recovered" comment when green again).
  report:
    name: Report
    needs: [flaky-hunt, vendor-extra, features]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      # No checkout in this job, so gh needs the repository spelled out.
      GH_REPO: ${{ github.repository }}
      NIGHTLY_EVENT: ${{ github.event_name }}
      NIGHTLY_PRESET: ${{ inputs.preset }}
    steps:
      - name: Summarize and manage the failure issue
        run: |
          case "$NIGHTLY_EVENT:$NIGHTLY_PRESET" in
            schedule:*|workflow_dispatch:|workflow_dispatch:standard)
              ;;
            workflow_dispatch:windows-dns-rst)
              {
                echo "## Partial diagnostic: windows-dns-rst"
                echo ""
                echo "Windows DNS package flaky-hunt result: ${{ needs.flaky-hunt.result }}"
                echo "Only the complete tor-socks5-dns package was selected, for 10 stress iterations with zero retries."
                echo "Other operating systems, other packages, vendored extras and feature checks were deliberately omitted."
                echo "Raw diagnostic output and JUnit are retained by the flaky-hunt job when available."
                echo "This is not a full Nightly result; success does not establish an RST cause or fix."
                echo "The normal Nightly failure issue is untouched."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
            *)
              echo "Invalid Nightly selection; the normal failure issue is untouched." >> "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
          esac
          # NOTE: needs.<matrix-job>.result is the WORST outcome across the
          # matrix (any failure/cancelled surfaces); per-OS detail is in the
          # uploaded artifacts and run logs, not in needs.*.result.
          {
            echo "## Nightly tests results"
            echo ""
            echo "| Job | Result |"
            echo "|-----|--------|"
            echo "| flaky-hunt | \`${{ needs.flaky-hunt.result }}\` |"
            echo "| vendor-extra | \`${{ needs.vendor-extra.result }}\` |"
            echo "| features | \`${{ needs.features.result }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          failed_jobs=""
          all_success=true
          for entry in "flaky-hunt=${{ needs.flaky-hunt.result }}" \
                       "vendor-extra=${{ needs.vendor-extra.result }}" \
                       "features=${{ needs.features.result }}"; do
            job="${entry%%=*}"
            result="${entry#*=}"
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              failed_jobs="${failed_jobs:+$failed_jobs, }$job"
              all_success=false
            elif [ "$result" != "success" ]; then
              # skipped or unexpected value: treat the run as incomplete.
              all_success=false
            fi
          done

          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          search="Nightly tests failed in:title,state:open"
          existing=$(gh issue list --search "$search" --json number --jq 'length')

          if [ -n "$failed_jobs" ]; then
            body="Nightly run failed: $run_url"$'\n'"Failed jobs: $failed_jobs"
            if [ "$existing" -eq 0 ]; then
              gh issue create --title "Nightly tests failed" --body "$body"
            else
              num=$(gh issue list --search "$search" --json number --jq '.[0].number')
              gh issue comment "$num" --body "$body"
            fi
          elif [ "$all_success" = "true" ] && [ "$existing" -gt 0 ]; then
            # Close as recovered only on a fully green run: every job must
            # have succeeded (skipped jobs mean an incomplete run).
            num=$(gh issue list --search "$search" --json number --jq '.[0].number')
            gh issue comment "$num" --body "recovered: $run_url"
            gh issue close "$num"
          elif [ "$all_success" != "true" ]; then
            echo "Incomplete run: some jobs were skipped or returned unexpected results;" >> "$GITHUB_STEP_SUMMARY"
            echo "the tracking issue (if any) is left untouched, no false 'recovered'." >> "$GITHUB_STEP_SUMMARY"
          fi
        shell: bash
